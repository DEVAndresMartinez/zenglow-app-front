<div class="w-screen h-dvh overflow-hidden flex justify-center bg-surface-page text-body">
  <main class="w-full h-full mx-auto flex flex-col"> <!-- max-w-7xl -->
    <div class="shrink-0 flex items-stretch">
      <button class="lg:hidden flex items-center justify-center px-4 border-b border-r border-stroke text-muted hover:bg-surface-hover hover:text-heading transition-colors" (click)="sidebarOpen.set(!sidebarOpen())">
        <fa-icon [icon]="['fas', sidebarOpen() ? 'xmark' : 'bars']"></fa-icon>
      </button>
      <app-navbar class="flex-1 min-w-0"></app-navbar>
    </div>
    <div class="flex-1 min-h-0 flex overflow-hidden relative">
      @if (sidebarOpen()) {
        <div class="absolute inset-0 bg-black/30 z-10 lg:hidden" (click)="sidebarOpen.set(false)"></div>
      }
      <div class="w-90" [class]="sidebarOpen()
        ? 'absolute lg:relative h-full flex shrink-0 overflow-auto z-20 shadow-xl bg-surface'
        : 'hidden lg:flex shrink-0 overflow-auto'">
        <app-options></app-options>
      </div>
      <div class="flex-1 overflow-auto p-2">
        <router-outlet></router-outlet>
      </div>
    </div>
  </main>
</div>
