<section class="w-full min-h-dvh flex justify-center items-center p-8 bg-slate-100">
  <div class="relative overflow-sections w-1/3 h-[90vh] rounded-4xl bg-linear-to-br from-blue-600 via-blue-700 to-indigo-800 shadow-2xl shadow-blue-900/40 border border-white/10 p-8 flex flex-col">
    <div class="h-full flex flex-col justify-between">
      <div class="flex flex-col">
        <div class="flex gap-4 items-center">
          <div class="w-12 h-12 rounded-full bg-white/10 backdrop-blur-md border border-white/20 flex items-center justify-center">
            <fa-icon [icon]="['fas', 'store']" class="text-white text-xl"></fa-icon>
          </div>
          <div>
            <h2 class="text-white font-bold text-2xl tracking-tight"> Zenglow</h2>
            <p class="text-blue-100 mt-2 text-md"> Configura tu negocio en pocos minutos. </p>
          </div>
        </div>
      </div>
      <div class="flex flex-col gap-2">
        <div class="flex justify-between text-sm text-blue-100">
          <span>Progreso inicial</span>
          <span>1 de 4 pasos</span>
        </div>
        <div class="h-1 bg-white/20 rounded-full overflow-hidden">
          <div class="h-full w-1/4 rounded-full bg-linear-to-r from-green-300 to-green-400"></div>
        </div>
      </div>
      <div class="bg-white/10 backdrop-blur-xl border border-white/20 rounded-3xl p-5 flex flex-col gap-5">
        <div>
          <h3 class="text-white text-2xl font-bold"> Inicia con Zenglow </h3>
          <p class="text-blue-100 mt-1"> Sigue estos pasos para comenzar. </p>
        </div>
        <div class="flex flex-col gap-2">
          <div class="flex items-center gap-4">
            <div class="w-8 h-8 rounded-full bg-green-400 flex items-center justify-center text-blue-900 font-bold"> 1 </div>
            <span class="text-white">
              Registra tu comercio
            </span>
          </div>
          <div class="flex items-center gap-4">
            <div class="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center text-white font-bold"> 2 </div>
            <span class="text-white"> Vincula tu sucursal principal </span>
          </div>
          <div class="flex items-center gap-4">
            <div class="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center text-white font-bold"> 3 </div>
            <span class="text-white"> Crea tu primer usuario </span>
          </div>
          <div class="flex items-center gap-4">
            <div class="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center text-white font-bold"> 4 </div>
            <span class="text-white"> Mejora tu productividad </span>
          </div>
        </div>
      </div>
      <div class="w-full flex justify-between gap-2">
        <button class="flex items-center gap-2 text-sm text-white/60 hover:text-white transition-all duration-300 cursor-pointer">
          <fa-icon [icon]="['fas', 'arrow-left']" class="text-white/60 text-xs"> </fa-icon>
          Volver
        </button>
        <button class="bg-green-400 hover:bg-green-500 transition-all duration-300 cursor-pointer text-white font-bold py-2 px-4 rounded-lg flex items-center gap-2">
          Siguiente
          <fa-icon [icon]="['fas', 'arrow-right']" class="text-white text-xs"> </fa-icon>
        </button>
      </div>
    </div>
  </div>
  <div class="w-2/3 h-[90vh]">
    @if (step() === 1) {
      <app-step-one-form />
    }@else if (step() === 2) {
      <!-- <app-step-two-form /> -->
    }

  </div>
</section>
