<div class="w-full h-full px-4 py-6 lg:px-10 lg:py-8 bg-surface-page flex flex-col">

  <h2 class="text-heading font-bold text-2xl tracking-tight">Paso 1</h2>
  <p class="text-body text-sm mt-1">Completa la información de tu comercio para comenzar.</p>

  <form [formGroup]="commerceForm"
    class="w-full mt-4 p-5 lg:p-8 bg-surface rounded-xl shadow-sm border border-stroke
           flex flex-col gap-4 lg:overflow-sections lg:flex-1"
    (submit)="submit()">

    <ui-dropdown-component
      id="commercetype" name="commercetype" [options]="commerceTypes"
      formControlName="commercetype" label="Tipo de Comercio"
      placeholder="ej. Peluquería, Restaurante, etc." [required]="true"/>

    <div class="flex flex-col sm:flex-row items-end gap-3">
      <ui-input-component
        type="text" id="commercename" name="commercename" formControlName="commercename"
        (input)="commerceSlugify()" label="Nombre del Comercio" placeholder="ej. Barbería"
        [required]="true" [minlength]="4" [maxlength]="150" appUppercase class="w-full sm:w-1/2"/>
      <ui-input-component
        type="text" id="commerceslug" name="commerceslug" formControlName="commerceslug"
        label="Slug del Comercio" placeholder="ej. barberia"
        [required]="true" [minlength]="4" [maxlength]="150" class="w-full sm:w-1/2"/>
    </div>

    <ui-input-component
      type="email" id="commerceemail" name="commerceemail" formControlName="commerceemail"
      label="Correo Electrónico" placeholder="ej. info@comercio.com"
      [required]="true" [error]="setEmailError()" [minlength]="4" [maxlength]="150" appLowercase/>

    <ui-phone-input-component
      id="commercephone" name="commercephone" countryCode="+57"
      formControlName="commercephone" label="Número de Teléfono"
      placeholder="ej. 300 000 0000" [required]="true"/>

    <div class="flex flex-col sm:flex-row items-end gap-3">
      <ui-dropdown-component
        id="commercedocumenttype" name="commercedocumenttype" [options]="documenttypes"
        formControlName="commercedocumenttype" label="Tipo de Documento"
        placeholder="ej. NIT, Cédula, etc." [required]="true" class="w-full sm:w-1/2"/>
      <div class="flex w-full sm:w-1/2 items-end gap-2">
        <ui-input-component
          type="text" id="commercedocumentnumber" name="commercedocumentnumber"
          formControlName="commercedocumentnumber" (input)="calcDV()"
          label="Número de Documento" placeholder="0"
          [required]="true" [minlength]="6" [maxlength]="10" appNumbersOnly class="flex-1"/>
        <ui-input-component
          type="text" id="commercedigitverification" name="commercedigitverification"
          formControlName="commercedigitverification" (input)="calcDV()"
          label="DV" placeholder="0" appNumbersOnly class="w-16"/>
      </div>
    </div>

  </form>

</div>
