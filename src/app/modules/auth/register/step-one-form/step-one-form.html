<div class="w-full p-10 bg-slate-100">
  <h2 class="text-slate-800 font-bold text-2xl tracking-tight">Paso 1</h2>
  <p class="text-slate-600 mt-2 text-md">Completa la información de tu comercio para comenzar.</p>

  <div class="w-full grid grid-cols-2 gap-4 mt-4 p-8 bg-white rounded-lg shadow">
    <ui-dropdown-component id="commercetype" name="commercetype" [options]="commerceTypes" value="commercetype()" (input)="commercetype.set($any($event.target).value)" label="Tipo de Comercio" placeholder="ej. Peluquería, Restaurante, etc." [required]="true"/>
    <ui-input-component type="text" id="commercename" name="commercename" value="commercename()" (input)="commercename.set($any($event.target).value); commerceSlugify()" label="Nombre del Comercio" placeholder="ej. Barbería" [required]="true"/>
    <ui-input-component type="email" id="commerceemail" name="commerceemail" value="commerceemail()" (input)="onEmailInput($any($event.target).value)" label="Correo Electrónico" placeholder="ej. info@comercio.com" [required]="true" [error]="setEmailError()"/>
    <ui-phone-input-component id="commercephone" name="commercephone" countryCode="+57" value="commercephone()" (input)="commercephone.set($any($event.target).value)" label="Número de Teléfono" placeholder="ej. 300 000 0000" [required]="true"/>
  </div>
</div>
