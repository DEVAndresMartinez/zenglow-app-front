<div class="w-full h-full px-4 py-6 lg:px-10 lg:py-8 bg-surface-page flex flex-col">

  <h2 class="text-heading font-bold text-2xl tracking-tight">Paso 2</h2>
  <p class="text-body text-sm mt-1">Registra tu sucursal principal.</p>

  <button type="button" (click)="useSame()"
    class="w-full flex items-center gap-3 px-4 py-3 mt-3 bg-primary-subtle border border-stroke rounded-lg text-sm font-medium text-primary-dark hover:border-primary transition-all duration-200 cursor-pointer group">
    <fa-icon [icon]="['fas', 'phone']" class="text-primary text-sm shrink-0"/>
    <span class="flex-1 text-left">Usar el teléfono del comercio</span>
    <fa-icon [icon]="['fas', 'arrow-right']" class="text-muted text-xs group-hover:text-primary transition-all duration-200"/>
  </button>

  <form [formGroup]="branchForm" class="w-full mt-4 p-5 lg:p-8 bg-surface rounded-xl shadow-sm border border-stroke flex flex-col gap-4 lg:overflow-sections lg:flex-1">

    <ui-input-component type="text" id="branchname" name="branchname" formControlName="branchname" label="Nombre de la Sucursal" placeholder="ej. Sucursal Norte" [required]="true" [minlength]="4" [maxlength]="150" appUppercase/>

    <div class="flex flex-col sm:flex-row items-end gap-3">
      <ui-dropdown-component id="city" name="city" [options]="citiesOptions" formControlName="branchcity" label="Ciudad" placeholder="ej. Bogotá" [required]="true" class="w-full sm:w-1/2"/>
      <ui-input-component type="text" id="branchaddress" name="branchaddress" formControlName="branchaddress" label="Dirección" placeholder="ej. Calle 80 # 20-15" [required]="true" [minlength]="4" [maxlength]="150" appUppercase class="w-full sm:w-1/2"/>
    </div>

    <ui-phone-input-component id="branchphone" name="branchphone" countryCode="+57" formControlName="branchphone" label="Número de Teléfono" placeholder="ej. 300 000 0000" [required]="true"/>

  </form>

</div>
