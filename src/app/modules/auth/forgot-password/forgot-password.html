<section class="w-full min-h-dvh flex flex-col justify-center items-center gap-6 p-6 bg-surface-page">

  <!-- Marca -->
  <div class="flex flex-col items-center gap-3">
    <div class="w-14 h-14 rounded-full bg-surface border border-stroke shadow-sm flex items-center justify-center">
      <img src="/favicon.png" alt="Logo Zenglow" class="w-9 h-9 object-contain" />
    </div>
    <div class="text-center">
      <h1 class="text-heading font-bold text-2xl tracking-tight">Zenglow</h1>
      <p class="text-muted text-sm mt-0.5">Gestiona tu negocio desde aquí</p>
    </div>
  </div>

  <!-- Tarjeta -->
  <div class="w-full max-w-sm bg-surface rounded-2xl shadow-sm border border-stroke p-8 flex flex-col gap-6">

    @if (!sent()) {

      <!-- Estado inicial: formulario -->
      <div>
        <h2 class="text-heading font-semibold text-lg">¿Olvidaste tu contraseña?</h2>
        <p class="text-muted text-sm mt-1">
          Ingresa tu correo y te enviaremos un enlace para restablecerla.
        </p>
      </div>

      <form [formGroup]="forgotForm" class="flex flex-col gap-4" (submit)="submit()">

        <ui-input-component
          type="email" id="email" name="email" formControlName="email"
          label="Correo electrónico" placeholder="ej. usuario@comercio.com"
          [required]="true" [maxlength]="150"/>

        <button
          type="submit"
          class="w-full flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl
                 bg-primary text-white font-semibold text-sm
                 hover:bg-primary-dark transition-all duration-200
                 disabled:opacity-50 disabled:cursor-not-allowed"
          [disabled]="forgotForm.invalid || loading()">
          @if (loading()) {
            <fa-icon [icon]="['fas', 'circle-notch']" class="text-sm animate-spin"/>
            Enviando...
          } @else {
            <fa-icon [icon]="['fas', 'paper-plane']" class="text-xs"/>
            Enviar enlace
          }
        </button>

      </form>

    } @else {

      <!-- Estado enviado: confirmación -->
      <div class="flex flex-col items-center gap-4 py-4 text-center">
        <div class="w-12 h-12 rounded-full bg-accent/15 flex items-center justify-center">
          <fa-icon [icon]="['fas', 'check']" class="text-accent-hover text-lg"/>
        </div>
        <div>
          <h2 class="text-heading font-semibold text-lg">Correo enviado</h2>
          <p class="text-muted text-sm mt-1">
            Revisa tu bandeja de entrada (y la carpeta de spam).<br/>
            El enlace expira en 30 minutos.
          </p>
        </div>
      </div>

    }

    <div class="flex items-center justify-center pt-2 border-t border-stroke">
      <button
        type="button"
        routerLink="/modules/auth/login"
        class="flex items-center gap-2 px-4 py-2 rounded-xl
               text-sm font-medium text-muted
               hover:text-primary-dark transition-all duration-200 cursor-pointer">
        <fa-icon [icon]="['fas', 'arrow-left']" class="text-xs"/>
        Volver al inicio de sesión
      </button>
    </div>

  </div>

</section>
