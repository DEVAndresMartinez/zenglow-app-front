<div class="flex flex-col gap-4">

  <div class="bg-surface rounded-2xl border border-stroke shadow-sm overflow-hidden">
    <div class="px-5 py-4 border-b border-stroke/60">
      <h2 class="text-sm font-semibold text-muted">Apariencia</h2>
    </div>

    <div class="flex items-center justify-between gap-4 px-5 py-4 border-b border-stroke/60">
      <div class="flex items-center gap-3 min-w-0">
        <div class="flex items-center justify-center w-10 h-10 rounded-xl bg-primary-subtle shrink-0">
          <fa-icon [icon]="['fas', themeService.mode() === 'dark' ? 'moon' : 'sun']" class="text-base text-primary"></fa-icon>
        </div>
        <div class="min-w-0">
          <p class="text-sm font-semibold text-heading">Modo oscuro</p>
          <p class="text-xs text-muted">
            {{ themeService.mode() === 'dark' ? 'Activado' : 'Desactivado' }} — cambia la apariencia de toda la aplicación.
          </p>
        </div>
      </div>

      <button
        type="button"
        role="switch"
        [attr.aria-checked]="themeService.mode() === 'dark'"
        (click)="toggleTheme()"
        class="relative inline-flex items-center shrink-0 w-12 h-7 rounded-full transition-colors duration-200 cursor-pointer"
        [class.bg-primary]="themeService.mode() === 'dark'"
        [class.bg-stroke]="themeService.mode() !== 'dark'">
        <span
          class="inline-block w-5 h-5 bg-surface rounded-full shadow-sm transform transition-transform duration-200"
          [class.translate-x-6]="themeService.mode() === 'dark'"
          [class.translate-x-1]="themeService.mode() !== 'dark'">
        </span>
      </button>
    </div>

    <div class="px-5 py-4">
      <p class="text-sm font-semibold text-heading mb-1">Paleta de color</p>
      <p class="text-xs text-muted mb-3">Elige la identidad visual de tu cuenta.</p>

      <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
        @for (option of paletteOptions; track option.key) {
          <button
            type="button"
            (click)="selectPalette(option.key)"
            class="group relative flex flex-col items-center gap-2 p-3 rounded-xl border transition-all duration-200 cursor-pointer"
            [class]="themeService.palette() === option.key ? 'border-primary bg-primary-subtle' : 'border-stroke hover:border-primary/40'">
            <span class="w-8 h-8 rounded-full shadow-sm border border-stroke/60" [style.background]="option.swatch"></span>
            <span class="text-xs font-medium text-heading">{{ option.label }}</span>
            @if (themeService.palette() === option.key) {
              <fa-icon [icon]="['fas', 'circle-check']" class="absolute top-1.5 right-1.5 text-xs text-primary"></fa-icon>
            }
          </button>
        }
      </div>
    </div>
  </div>

</div>
