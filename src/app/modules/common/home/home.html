<div class="grid grid-cols-3 gap-2 items-center">
    <div class="flex items-center gap-2">
        <div class="relative flex items-center justify-center w-12 h-12 rounded-xl bg-error/10 border border-error/30 transition-all duration-300">
            <fa-icon [icon]="['fas', 'times-circle']" class="text-error text-lg"> </fa-icon>
        </div>
        <div class="flex flex-col">
            <h2 class="text-sm font-bold text-heading">Citas canceladas</h2>
            <p class="text-xs text-muted">Has cancelado 3 citas hoy.</p>
        </div>
    </div>
    <div class="flex items-center gap-2">
        <div class="relative flex items-center justify-center w-12 h-12 rounded-xl bg-warning/10 border border-warning/30 transition-all duration-300">
            <fa-icon [icon]="['fas', 'clock']" class="text-warning-hover text-lg"> </fa-icon>
        </div>
        <div class="flex flex-col">
            <h2 class="text-sm font-bold text-heading">Citas pendientes</h2>
            <p class="text-xs text-muted">Tienes 5 citas pendientes para hoy.</p>
        </div>
    </div>
    <div class="flex items-center gap-2">
        <div class="relative flex items-center justify-center w-12 h-12 rounded-xl bg-accent/10 border border-accent-soft transition-all duration-300">
            <fa-icon [icon]="['fas', 'check-circle']" class="text-accent-hover text-lg"> </fa-icon>
        </div>
        <div class="flex flex-col">
            <h2 class="text-sm font-bold text-heading">Citas completadas</h2>
            <p class="text-xs text-muted">Has completado 10 citas esta hoy.</p>
        </div>
    </div>
</div>
