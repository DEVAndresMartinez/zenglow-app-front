<div class="grid grid-cols-3 gap-2 items-center">
    <div class="flex items-center gap-2">
        <div class="relative flex items-center justify-center w-12 h-12 rounded-xl bg-red-50 border border-red-200 transition-all duration-300">
            <fa-icon [icon]="['fas', 'times-circle']" class="text-red-400 text-lg"> </fa-icon>
        </div>
        <div class="flex flex-col">
            <h2 class="text-sm font-bold text-gray-800">Citas canceladas</h2>
            <p class="text-xs text-gray-500">Has cancelado 3 citas hoy.</p>
        </div>
    </div>
    <div class="flex items-center gap-2">
        <div class="relative flex items-center justify-center w-12 h-12 rounded-xl bg-yellow-50 border border-yellow-200 transition-all duration-300">
            <fa-icon [icon]="['fas', 'clock']" class="text-yellow-400 text-lg"> </fa-icon>
        </div>
        <div class="flex flex-col">
            <h2 class="text-sm font-bold text-gray-800">Citas pendientes</h2>
            <p class="text-xs text-gray-500">Tienes 5 citas pendientes para hoy.</p>
        </div>
    </div>
    <div class="flex items-center gap-2">
        <div class="relative flex items-center justify-center w-12 h-12 rounded-xl bg-green-50 border border-green-200 transition-all duration-300">
            <fa-icon [icon]="['fas', 'check-circle']" class="text-green-400 text-lg"> </fa-icon>
        </div>
        <div class="flex flex-col">
            <h2 class="text-sm font-bold text-gray-800">Citas completadas</h2>
            <p class="text-xs text-gray-500">Has completado 10 citas esta hoy.</p>
        </div>
    </div>
</div>
