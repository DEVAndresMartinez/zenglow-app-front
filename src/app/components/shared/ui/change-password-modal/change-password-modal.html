@if (showModal()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm p-4">
    <div class="w-full max-w-sm bg-surface rounded-2xl shadow-lg border border-stroke p-8 flex flex-col gap-6">

      @if (!success()) {
        <div class="flex flex-col gap-1">
          <div class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center mb-2">
            <fa-icon [icon]="['fas', 'lock']" class="text-primary"/>
          </div>
          <h2 class="text-heading font-semibold text-lg">Cambia tu contraseña</h2>
          <p class="text-muted text-sm">Por seguridad, debes establecer una nueva contraseña antes de continuar.</p>
        </div>

        <form [formGroup]="form" class="flex flex-col gap-4" (ngSubmit)="submit()">
          <ui-input-component type="password" formControlName="newpassword" label="Nueva contraseña" placeholder="Mínimo 8 caracteres" [required]="true"/>
          <ui-input-component type="password" formControlName="confirmpassword" label="Confirmar contraseña" placeholder="Repite tu nueva contraseña" [required]="true" [error]="confirmError"/>

          @if (error()) {
            <p class="text-sm text-danger">{{ error() }}</p>
          }

          <button type="submit" [disabled]="form.invalid || loading()" class="w-full flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl bg-primary text-white font-semibold text-sm hover:bg-primary-dark transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer">
            @if (loading()) {
              <fa-icon [icon]="['fas', 'circle-notch']" class="text-sm animate-spin"/>
              Guardando...
            } @else {
              <fa-icon [icon]="['fas', 'check']" class="text-xs"/>
              Cambiar contraseña
            }
          </button>
        </form>

        <div class="flex items-center justify-center pt-2 border-t border-stroke">
          <button type="button" (click)="logout()" class="flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-medium text-muted hover:text-danger transition-all duration-200 cursor-pointer">
            <fa-icon [icon]="['fas', 'arrow-right-from-bracket']" class="text-xs"/>
            Cerrar sesión
          </button>
        </div>

      } @else {
        <div class="flex flex-col items-center gap-4 py-4 text-center">
          <div class="w-12 h-12 rounded-full bg-accent/15 flex items-center justify-center">
            <fa-icon [icon]="['fas', 'check']" class="text-accent-hover text-lg"/>
          </div>
          <div>
            <h2 class="text-heading font-semibold text-lg">¡Contraseña actualizada!</h2>
            <p class="text-muted text-sm mt-1">Tu contraseña se ha cambiado correctamente.<br/>Serás redirigido en unos segundos.</p>
          </div>
        </div>
      }

    </div>
  </div>
}
