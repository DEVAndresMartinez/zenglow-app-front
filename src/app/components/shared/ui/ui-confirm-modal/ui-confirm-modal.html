<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm p-4">
  <div class="w-full max-w-sm bg-surface rounded-2xl shadow-lg border border-stroke p-6 flex flex-col gap-5">
    <div class="flex flex-col items-center gap-3 text-center">
      <div class="w-12 h-12 rounded-full flex items-center justify-center"
           [class]="variant() === 'danger' ? 'bg-error/10' : 'bg-primary/10'">
        <fa-icon [icon]="['fas', icon()]" class="text-lg" [class]="variant() === 'danger' ? 'text-error' : 'text-primary'"/>
      </div>
      <div>
        <h2 class="text-heading font-semibold text-lg">{{ title() }}</h2>
        <p class="text-muted text-sm mt-1">{{ message() }}</p>
      </div>
    </div>

    @if (error()) {
      <p class="text-sm text-error text-center px-1">{{ error() }}</p>
    }

    <div class="flex gap-3">
      <button type="button" (click)="onCancel()" [disabled]="loading()" class="flex-1 px-4 py-2.5 rounded-xl border-2 border-stroke text-muted font-medium text-sm hover:border-primary/30 hover:text-heading transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer">
        {{ cancelText() }}
      </button>
      <button type="button" (click)="onConfirm()" [disabled]="loading()"
              class="flex-1 flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl text-white font-semibold text-sm transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer"
              [class]="variant() === 'danger' ? 'bg-error hover:bg-error/90' : 'bg-primary hover:bg-primary-dark'">
        @if (loading()) {
          <fa-icon [icon]="['fas', 'circle-notch']" class="text-sm animate-spin"/>
        } @else {
          <fa-icon [icon]="['fas', icon()]" class="text-xs"/>
        }
        {{ confirmText() }}
      </button>
    </div>
  </div>
</div>
