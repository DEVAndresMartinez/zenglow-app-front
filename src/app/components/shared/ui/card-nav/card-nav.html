<a [routerLink]="link" routerLinkActive="active" class="group relative w-full flex items-center gap-4 p-2 rounded-2xl bg-surface border border-stroke shadow-sm hover:shadow-xl hover:border-primary/40 transition-all duration-300 ease-out hover:-translate-y-1 overflow-hidden">
    <div class="absolute inset-0 opacity-0 group-hover:opacity-100 transition-opacity duration-500 bg-linear-to-r from-primary-subtle via-transparent to-primary-subtle"></div>
    <div class="relative flex items-center justify-center w-12 h-12 rounded-xl bg-primary-subtle border border-on-brand-muted transition-all duration-300 group-hover:scale-105 group-hover:rotate-3">
        <fa-icon [icon]="icon" [ngClass]="color" class="text-2xl transition-transform duration-300 group-hover:scale-105"> </fa-icon>
    </div>
    <div class="relative flex-1 min-w-0">
        <h3 class="text-base font-semibold text-heading transition-colors duration-300 group-hover:text-primary">{{ title }}</h3>
        <p class="text-xs text-muted mt-1 transition-colors duration-300 group-hover:text-body">{{ description }}</p>
    </div>
    <div class="relative flex items-center justify-center opacity-0 translate-x-2 group-hover:opacity-100 group-hover:translate-x-0 transition-all duration-300">
        <fa-icon [icon]="['fas', 'arrow-right']" class="text-muted group-hover:text-primary"></fa-icon>
    </div>
</a>
