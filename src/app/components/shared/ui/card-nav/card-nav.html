<a [routerLink]="link" routerLinkActive="active" class="group relative w-full flex items-center gap-4 p-2 rounded-2xl bg-white border border-gray-200 shadow-sm hover:shadow-xl hover:border-blue-300 transition-all duration-300 ease-out hover:-translate-y-1 overflow-hidden">
    <div class="absolute inset-0 opacity-0 group-hover:opacity-100 transition-opacity duration-500 bg-linear-to-r from-blue-50 via-transparent to-blue-50"></div>
    <div class="relative flex items-center justify-center w-12 h-12 rounded-xl bg-blue-50 border border-blue-200 transition-all duration-300 group-hover:bg-blue-100 group-hover:scale-105 group-hover:rotate-3">
        <fa-icon [icon]="icon" [ngClass]="color" class="text-2xl transition-transform duration-300 group-hover:scale-105"> </fa-icon>
    </div>
    <div class="relative flex-1 min-w-0">
        <h3 class="text-base font-semibold text-gray-800 transition-colors duration-300 group-hover:text-blue-700">{{ title }}</h3>
        <p class="text-xs text-gray-500 mt-1 transition-colors duration-300 group-hover:text-gray-600">{{ description }}</p>
    </div>
    <div class="relative flex items-center justify-center opacity-0 translate-x-2 group-hover:opacity-100 group-hover:translate-x-0 transition-all duration-300">
        <fa-icon [icon]="['fas', 'arrow-right']" class="text-gray-400 group-hover:text-blue-600"></fa-icon>
    </div>
</a>
