<div class="w-full flex flex-col gap-1">

  @if (label()) {
  <label class="text-slate-600 font-medium text-sm w-full">
    <p>{{ label() }} @if (required()) { <span class="text-red-500"> * </span> }</p>
  </label>
  }

  <div class="relative">

    @if (isTextarea()) {
    <textarea
      class="w-full px-4 py-2 border-2 rounded-md text-sm text-slate-500 focus:text-slate-700 focus:outline-none transition-all duration-300 roboto resize-none"
      [class.border-slate-300]="!error()" [class.focus:border-blue-600]="!error()" [class.border-red-400]="error()"
      [placeholder]="placeholder()" [disabled]="isDisabled()" [readOnly]="readonly()" [required]="required()"
      [attr.maxlength]="maxlength()" [attr.minlength]="minlength()" [value]="value()" (input)="onInput($event)"
      (blur)="onBlur()"></textarea>
    } @else {
    <input
      class="w-full px-4 py-2 border-2 rounded-md text-sm text-slate-500 focus:text-slate-700 focus:outline-none focus:shadow-blue-300 transition-all duration-300 roboto"
      [class.border-slate-300]="!error()" [class.focus:border-blue-600]="!error()" [class.border-red-400]="error()"
      [class.pr-10]="isPassword()" [type]="visibleType()" [placeholder]="placeholder()" [disabled]="isDisabled()"
      [readOnly]="readonly()" [required]="required()" [attr.maxlength]="maxlength()" [attr.minlength]="minlength()"
      [min]="min() ?? ''" [max]="max() ?? ''" [step]="step() ?? ''" [value]="value()" (input)="onInput($event)"
      (blur)="onBlur()" />
    }

    @if (isPassword()) {
    <button type="button" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 text-xs"
      (click)="togglePassword()">
      {{ showPassword() ? 'Ocultar' : 'Mostrar' }}
    </button>
    }

  </div>

  @if (error()) {
  <span class="text-red-500 text-xs">{{ error() }}</span>
  } @else if (hint()) {
  <span class="text-slate-400 text-xs">{{ hint() }}</span>
  }

  @if (isPassword() && value()) {
  <div class="flex gap-1 mt-1">
    @for (n of [1,2,3,4,5]; track n) {
    <span class="h-1 flex-1 rounded-full transition-colors duration-200"
      [class.bg-red-400]="strength() >= n && strength() <= 2"
      [class.bg-yellow-400]="strength() >= n && strength() === 3"
      [class.bg-green-500]="strength() >= n && strength() >= 4" [class.bg-slate-200]="strength() < n"></span>
    }
  </div>
  }

</div>
