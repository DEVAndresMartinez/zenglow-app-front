<div class="w-full flex flex-col gap-1">

  @if (label()) {
  <label class="text-slate-600 font-medium text-sm w-full">
    <p>{{ label() }} @if (required()) { <span class="text-red-500"> * </span> }</p>
  </label>
  }

  <div
    class="w-full flex items-center border-2 rounded-md transition-all duration-300 overflow-hidden focus-within:shadow-blue-300"
    [class.border-slate-300]="!error()" [class.focus-within:border-blue-600]="!error()" [class.border-red-400]="error()"
    [class.opacity-60]="isDisabled()">
    <!-- Prefijo país -->
    <span
      class="px-3 py-2 text-sm font-medium text-slate-600 bg-slate-100 border-r-2 border-slate-300 select-none roboto shrink-0">
      {{ countryCode() }}
    </span>

    <!-- Input dígitos -->
    <input type="tel" inputmode="numeric" pattern="[0-9]*"
      class="flex-1 px-4 py-2 text-sm text-slate-500 focus:text-slate-700 focus:outline-none bg-transparent roboto"
      placeholder="300 000 0000" maxlength="10" [value]="digits()" [disabled]="isDisabled()" [required]="required()"
      (input)="onInput($event)" (blur)="onBlur()" />

    <!-- Contador -->
    <span class="pr-3 text-xs text-slate-400 shrink-0 roboto">
      {{ digits().length }}/10
    </span>
  </div>

  @if (error()) {
  <span class="text-red-500 text-xs">{{ error() }}</span>
  } @else if (hint()) {
  <span class="text-slate-400 text-xs">{{ hint() }}</span>
  }

</div>
