<div class="relative w-full h-full">
  @if (currentImage(); as img) {
    <img [src]="img.serviceimageurl" class="w-full h-full object-cover" [alt]="alt()">
  } @else {
    <div class="w-full h-full flex items-center justify-center">
      <fa-icon [icon]="['fas', 'briefcase']" class="text-2xl text-on-brand-muted"></fa-icon>
    </div>
  }

  @if (sortedImages().length > 1) {
    <button type="button" (click)="prev($event)" class="absolute left-1 top-1/2 -translate-y-1/2 flex items-center justify-center w-6 h-6 rounded-full bg-black/50 text-white hover:bg-black/70 transition-colors duration-200 cursor-pointer">
      <fa-icon [icon]="['fas', 'chevron-left']" class="text-[10px]"/>
    </button>
    <button type="button" (click)="next($event)" class="absolute right-1 top-1/2 -translate-y-1/2 flex items-center justify-center w-6 h-6 rounded-full bg-black/50 text-white hover:bg-black/70 transition-colors duration-200 cursor-pointer">
      <fa-icon [icon]="['fas', 'chevron-right']" class="text-[10px]"/>
    </button>
    <div class="absolute bottom-1.5 left-1/2 -translate-x-1/2 flex items-center gap-1">
      @for (img of sortedImages(); track img.serviceimageuuid; let i = $index) {
        <span class="w-1.5 h-1.5 rounded-full transition-colors duration-200" [class.bg-white]="i === activeIndex()" [class.bg-white/40]="i !== activeIndex()"></span>
      }
    </div>
  }
</div>
