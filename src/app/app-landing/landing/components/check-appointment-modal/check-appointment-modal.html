@if (visible()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm p-4">
    <div class="w-full max-w-sm bg-surface rounded-2xl shadow-lg border border-stroke p-8 flex flex-col gap-6">

      <div class="flex items-start justify-between">
        <div class="flex flex-col gap-1">
          <div class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center mb-2">
            <fa-icon [icon]="['fas', 'magnifying-glass']" class="text-primary"/>
          </div>
          <h2 class="text-heading font-semibold text-lg">Consultar mi cita</h2>
          <p class="text-muted text-sm">Pega el enlace que recibiste al reservar tu cita (o el código que te dieron).</p>
        </div>
        <button type="button" (click)="close()" aria-label="Cerrar" class="w-8 h-8 rounded-lg flex items-center justify-center text-muted hover:bg-surface-hover cursor-pointer shrink-0">
          <fa-icon [icon]="['fas', 'xmark']"/>
        </button>
      </div>

      <form class="flex flex-col gap-4" (ngSubmit)="submit()">
        <div class="flex flex-col gap-1">
          <label class="text-xs font-medium text-body">Enlace o código de tu cita</label>
          <input type="text" [formControl]="control" placeholder="https://.../citas/xxxxxxxx-xxxx..."
            class="px-3 py-2 rounded-xl border border-stroke text-sm text-input bg-surface focus:outline-none focus:border-stroke-focus">
          @if (touched() && control.invalid) {
            <p class="text-xs text-error">Ingresa el enlace o el código de tu cita.</p>
          }
        </div>

        <button type="submit" class="w-full flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl bg-primary text-white font-semibold text-sm hover:bg-primary-dark transition-all duration-200 cursor-pointer">
          <fa-icon [icon]="['fas', 'arrow-right']" class="text-xs"/>
          Ver estado de mi cita
        </button>
      </form>

    </div>
  </div>
}
