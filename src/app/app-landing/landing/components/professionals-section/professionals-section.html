<section id="profesionales" class="w-full flex justify-center bg-surface-page px-6 md:px-10 py-8">
  <div class="w-full max-w-360 flex flex-col gap-4">
    <h2 class="text-heading font-semibold text-lg">Nuestro equipo</h2>

    @if (loading()) {
      <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-4">
        @for (i of [1, 2, 3, 4, 5, 6]; track i) {
          <div class="bg-surface border border-stroke rounded-2xl p-4 flex flex-col items-center gap-2 animate-pulse">
            <div class="w-14 h-14 rounded-full bg-stroke"></div>
            <div class="h-3 w-3/4 bg-stroke rounded"></div>
          </div>
        }
      </div>
    } @else if (professionals().length) {
      <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-4">
        @for (professional of professionals(); track professional.useruuid) {
          <button type="button" (click)="bookProfessional.emit(professional)"
            class="flex flex-col items-center gap-2 bg-surface border border-stroke rounded-2xl p-4 text-center hover:border-primary transition-all duration-150 cursor-pointer">
            <img [src]="professional.userimage || 'favicon.png'" [alt]="professional.userfirstname"
              class="w-14 h-14 rounded-full object-cover">
            <div class="min-w-0 w-full">
              <p class="text-sm font-semibold text-heading truncate">{{ professional.userfirstname }} {{ professional.userlastname }}</p>
              @if (professional.userspecialty) {
                <p class="text-xs text-muted truncate">{{ professional.userspecialty }}</p>
              }
            </div>
          </button>
        }
      </div>
    } @else {
      <p class="text-sm text-muted">Este comercio aún no tiene profesionales registrados.</p>
    }
  </div>
</section>
